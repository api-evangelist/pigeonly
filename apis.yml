name: Pigeonly
description: >-
  Pigeonly is an inmate-communication service that helps families and friends stay connected with
  incarcerated loved ones across more than 4,000 correctional facilities in the United States. Through
  its website and mobile apps, users can send photos, letters, postcards, greeting cards, and printed
  articles, and set up more affordable prison phone calls, all in a few clicks. Backed by 500 Global,
  Pigeonly is a consumer-facing platform; as of this enrichment pass it publishes no public API,
  developer portal, developer documentation, OAuth surface, or machine-readable specifications, so this
  profile captures its identity, public web properties, and probed domain-security posture rather than
  API artifacts.
